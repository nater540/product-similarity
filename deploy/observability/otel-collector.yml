# An OpenTelemetry Collector for `just observe-up`: it receives what the server sends over gRPC (OTLP, port
# 4317), passes the traces on to Jaeger, and offers the metrics to Prometheus on port 8889. `debug` also writes
# a line for each batch to the collector's log (`docker compose logs otel-collector`).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp/jaeger, debug]
    metrics:
      receivers: [otlp]
      exporters: [prometheus, debug]
