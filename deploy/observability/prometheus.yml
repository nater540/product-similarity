# Prometheus for `just observe-up`: the two ways the server's metrics get out, side by side.
#
# - `record-similarity-page` scrapes the server's own page (`telemetry.metrics_listen`), on the machine Docker
#   runs on.
# - `record-similarity-pushed` scrapes the collector, which holds what the server sent to it over gRPC
#   (`telemetry.otlp_endpoint`).
#
# The same metric appears once under each job, and the two should agree.

global:
  scrape_interval: 5s

scrape_configs:
  - job_name: record-similarity-page
    static_configs:
      - targets: ["host.docker.internal:9464"]

  - job_name: record-similarity-pushed
    static_configs:
      - targets: ["otel-collector:8889"]
