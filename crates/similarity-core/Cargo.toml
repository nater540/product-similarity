[package]
name = "similarity-core"
description = "Record embedding and similarity scoring: the Burn encoder, tokenization, and the accept/reject policy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[features]
# Exposes `similarity_core::testing` (tiny in-memory models) to the tests of crates built on this one.
testing = []
# Lets an `Embedder` run its forward pass through ONNX Runtime (C++) from the model directory's `onnx/model.onnx`.
# The server turns it on, always; it is a feature so that the trainer, which depends on this crate, links no C++.
onnx = ["dep:ort"]

[dependencies]
burn.workspace = true
burn-store.workspace = true
tokenizers.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
ort = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
