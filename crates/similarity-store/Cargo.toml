[package]
name = "similarity-store"
description = "Where record vectors live: the store contract, an in-memory implementation, and the Qdrant one."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
similarity-core.workspace = true
# `serde` lets the point payload be a typed struct instead of hand-assembled protobuf values.
qdrant-client = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
