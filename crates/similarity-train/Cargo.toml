[package]
name = "similarity-train"
description = "Fine-tunes the record-similarity embedding model on labeled product data, in Burn."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "record-similarity-train"
path = "src/main.rs"

[features]
# Train on the GPU through Metal (Apple silicon). Select it at runtime with `--device metal`.
metal = ["burn/metal"]
# Train on an NVIDIA GPU. Select it at runtime with `--device cuda`.
cuda = ["burn/cuda"]

[dependencies]
similarity-core.workspace = true

# The only crate in the workspace that turns on Burn's automatic differentiation and optimizers. Cargo unifies
# features per build, so `cargo build -p similarity-server` (what `just release` and the Dockerfile run) still
# produces an inference-only server; see D13 in docs/decisions.md.
burn = { workspace = true, features = ["autodiff", "optim"] }

anyhow.workspace = true
clap.workspace = true
serde.workspace = true
# A checkpoint records its run's options and a resume compares them for equality, so every f64 must read back
# exactly as written: that is the workspace's `float_roundtrip` feature (see the root `Cargo.toml`).
serde_json.workspace = true
# Fingerprints the training data, so a checkpoint is only resumed on the examples it was made from.
sha2.workspace = true
similarity-log.workspace = true
similarity-runs.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
similarity-core = { workspace = true, features = ["testing"] }
similarity-log = { workspace = true, features = ["testing"] }
tempfile.workspace = true

[lints]
workspace = true
