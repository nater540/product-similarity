[package]
name = "similarity-server"
description = "The record-similarity gRPC server and its command-line entry point."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "record-similarity"
path = "src/main.rs"

[dependencies]
# With `onnx`: every command of this binary runs the forward pass through ONNX Runtime (C++), checked against Burn
# at load (docs/decisions.md, D34). The feature stays a feature of the core so that the trainer builds without it.
similarity-core = { workspace = true, features = ["onnx"] }
similarity-log.workspace = true
similarity-runs.workspace = true
similarity-proto.workspace = true
similarity-store.workspace = true

tonic.workspace = true
tonic-health.workspace = true
tonic-reflection.workspace = true
axum.workspace = true
tokio.workspace = true
tokio-stream.workspace = true

anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
ureq.workspace = true

[dev-dependencies]
# The tiny in-memory encoder, so that the offline tools are tested end to end without a model directory.
similarity-core = { workspace = true, features = ["testing"] }
# Capturing the result stream, to test what `calibrate --ndjson` writes.
similarity-log = { workspace = true, features = ["testing"] }
proptest.workspace = true
tempfile.workspace = true
# The example client is a single-threaded program; the server itself never uses the current-thread runtime.
# `io-util`: the metrics endpoint is tested with a hand-written HTTP request over a socket, as a scraper sends one.
tokio = { workspace = true, features = ["rt", "io-util"] }

[lints]
workspace = true
