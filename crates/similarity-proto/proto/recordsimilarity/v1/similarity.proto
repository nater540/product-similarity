syntax = "proto3";

package recordsimilarity.v1;

// Decides whether a proposed revision of a record is still the same record.
//
// Records are embedded field by field with a sentence-embedding model. The vectors of every accepted revision are
// kept, so that the next revision of the same `id` can be compared against them and so that records can be searched
// by similarity.
//
// A record may also carry quantities (a weight, a volume, a potency). Those are compared as numbers, after unit
// conversion, and are never embedded: they do not move any similarity reported here.
service RecordSimilarity {
  // Embeds a record and, when it has an `id`, judges it against the stored baseline for that id.
  //
  // - No `id`: the record is embedded and nothing is compared or stored (`VERDICT_EMBEDDED`).
  // - An `id` with no stored baseline: the record becomes the baseline (`VERDICT_CREATED`).
  // - An `id` with a baseline: the record is compared against it (`VERDICT_ACCEPTED` or `VERDICT_REJECTED`), and
  //   replaces the baseline only if it is accepted. A rejected revision leaves the stored record untouched, so a
  //   retry with the original content still compares against the original.
  //
  // Errors: `INVALID_ARGUMENT` for a record that does not fit the configured schema (an unknown field or quantity,
  // a quantity that is not a usable measurement) or a `mode` this server does not know, `FAILED_PRECONDITION` if the stored baseline belongs to a tenant the request does not name or was
  // written under a different model or schema layout, `RESOURCE_EXHAUSTED` if the embedding queue is full,
  // `UNAVAILABLE` if the vector store cannot be reached.
  rpc Evaluate(EvaluateRequest) returns (EvaluateResponse);

  // Finds stored records similar to a given one, most similar first.
  //
  // For two records with values for the same fields, the similarity reported here is exactly the weighted score
  // `Evaluate` uses, so "what did this record turn into?" and "does this already exist?" are answered on the same
  // scale as the accept/reject decision. A field that only one of the two has a value for lowers the score here,
  // whereas `Evaluate` leaves such a field out. Quantities play no part in a search: it compares vectors.
  rpc FindSimilar(FindSimilarRequest) returns (FindSimilarResponse);

  // Forgets a record. The next `Evaluate` for its id starts a new baseline.
  //
  // Errors: `FAILED_PRECONDITION` if the record is stored under a tenant the request does not name.
  rpc Delete(DeleteRequest) returns (DeleteResponse);

  // Finds the stored records a listing from elsewhere describes (a retailer's menu item, say), best first, and
  // says whether the best is the same product. Read-only: nothing is stored or changed.
  //
  // Unlike `FindSimilar`, each candidate is scored exactly over the fields both it and the listing have, so a
  // listing with only a name is scored on its name whatever else a stored record has filled in. Quantities are
  // compared and reported for each candidate and never move a similarity or the decision.
  //
  // Errors: `INVALID_ARGUMENT` for a listing that does not fit the schema, that carries an `id` or a `tenant`,
  // for a `limit` above 100, or for a `threshold` outside [-1, 1]; `RESOURCE_EXHAUSTED` and `UNAVAILABLE` as for
  // `Evaluate`.
  rpc Match(MatchRequest) returns (MatchResponse);

  // Reports the model, schema, and thresholds this server is running with.
  rpc Describe(DescribeRequest) returns (DescribeResponse);
}

// A measured amount with its unit: a weight, a volume, a potency.
//
// A single value is sent as a range whose ends are equal. A caller that has only one end of a range sends it as
// both.
message Quantity {
  // The low end. Finite and not negative.
  double min = 1;

  // The high end. Finite and not below `min`.
  double max = 2;

  // The unit both ends are in, for example `g`, `mg`, `oz`, `ml`, `fl oz`, or `%`. Matched without regard to case
  // or surrounding space. Mass, volume, and percentage units are converted before comparing, so `1 g` and
  // `1000 mg` are the same quantity. Any other unit is accepted and is comparable only with itself. Not blank.
  string unit = 3;
}

// A record to embed.
message Record {
  // The caller's identifier for the record. Opaque to this service; any non-empty string.
  optional string id = 1;

  // The owner of the record (a merchant, an account). Stored with the record and usable as a search filter.
  //
  // Once a record is stored under a tenant, every later `Evaluate` or `Delete` for its id must name that same
  // tenant; one that names another tenant, or none, is refused. A record stored without a tenant takes the tenant
  // of the first revision that names one. This catches a caller applying one merchant's edit to another merchant's
  // record. It is a consistency check and not access control: this service does not authenticate its callers.
  optional string tenant = 2;

  // Field name to text. Names must be ones the server's schema defines (see `Describe`). A missing field and a
  // blank one are the same thing: no value.
  map<string, string> fields = 3;

  // Quantity name to value. Names must be ones the server's schema defines as quantities (see `Describe`); a
  // quantity is never sent as text in `fields`. A quantity the record does not have is left out.
  map<string, Quantity> quantities = 4;
}

// What `Evaluate` may do to the stored baseline.
enum WriteMode {
  // Same as `WRITE_MODE_ENFORCE`.
  WRITE_MODE_UNSPECIFIED = 0;

  // Store the record if it is new or accepted; leave the baseline alone if it is rejected.
  WRITE_MODE_ENFORCE = 1;

  // Never write. Use this to preview a verdict, for example while a merchant is still typing.
  WRITE_MODE_DRY_RUN = 2;

  // Always store, whatever the verdict, and make this revision the new anchor for drift detection. This is the
  // override for a human reviewer who has decided the change is legitimate. The response still reports the verdict
  // the policy would have given.
  WRITE_MODE_FORCE = 3;
}

message EvaluateRequest {
  // The record. Required.
  Record record = 1;

  WriteMode mode = 2;

  // Overrides the server's overall similarity threshold for this request. Cosine scale, [-1, 1].
  optional float threshold = 3;

  // Return the record's composite vector in the response.
  bool return_vector = 4;
}

enum Verdict {
  VERDICT_UNSPECIFIED = 0;

  // The record had no `id`: it was embedded, and nothing was compared or stored.
  VERDICT_EMBEDDED = 1;

  // There was no baseline for this `id`; this record is now the baseline (unless the mode was `DRY_RUN`).
  VERDICT_CREATED = 2;

  // The record is similar enough to its baseline to be the same record.
  VERDICT_ACCEPTED = 3;

  // The record differs too much from its baseline; `reasons` says why.
  VERDICT_REJECTED = 4;
}

enum FieldChange {
  FIELD_CHANGE_UNSPECIFIED = 0;

  // The text is identical after whitespace normalization.
  FIELD_CHANGE_UNCHANGED = 1;

  // Both the baseline and the record have a value, and the text differs.
  FIELD_CHANGE_MODIFIED = 2;

  // Only the record has a value, and the stored record has never had one for this field.
  FIELD_CHANGE_ADDED = 3;

  // Only the baseline has a value.
  FIELD_CHANGE_REMOVED = 4;

  // The baseline has no value, but the record had one when it was first stored (or last force-written), and now
  // has one again. The field is scored against that original value, so that removing a field and then filling it
  // with something else is judged like any other change to it.
  FIELD_CHANGE_RESTORED = 5;
}

// How one field of the record compares with the baseline.
message FieldScore {
  string field = 1;

  FieldChange change = 2;

  // Cosine similarity between the baseline's value and the record's; for `FIELD_CHANGE_RESTORED`, between the
  // field's original value and the record's. Absent for `FIELD_CHANGE_ADDED` and `FIELD_CHANGE_REMOVED`.
  optional float similarity = 3;

  // The field's weight in the overall score.
  float weight = 4;

  // The field's similarity is below its own floor, which rejects the record regardless of the overall score.
  bool below_floor = 5;
}

// What happened to one quantity between the baseline and the record. The first five values mean what the
// `FieldChange` of the same name means.
enum QuantityChange {
  QUANTITY_CHANGE_UNSPECIFIED = 0;

  // The amounts are equal after unit conversion.
  QUANTITY_CHANGE_UNCHANGED = 1;

  // Both the baseline and the record have a value, in comparable units, and the amounts differ.
  QUANTITY_CHANGE_MODIFIED = 2;

  // Only the record has a value, and the stored record has never had one for this quantity.
  QUANTITY_CHANGE_ADDED = 3;

  // Only the baseline has a value.
  QUANTITY_CHANGE_REMOVED = 4;

  // The baseline has no value, but the record had one when it was first stored (or last force-written), and now
  // has one again. The quantity is compared with that original value, so that removing a quantity and then
  // filling it with another is judged like any other change to it.
  QUANTITY_CHANGE_RESTORED = 5;

  // Both the baseline and the record have a value, but in units that cannot be converted into one another (`%`
  // and `mg`, say). This is not a bigger or smaller amount; it is a different kind of measurement.
  QUANTITY_CHANGE_INCOMPARABLE = 6;
}

// Why a revision was rejected, as data. Each value names one kind of check. The string beside each is the `code`
// that `calibrate --ndjson` writes on its `pair_reason` lines (the value's name without its prefix, in lower case),
// so a reason seen here and one seen in a calibration go by the same name.
//
// A server newer than a client may send a value the client does not know. Show the sentence at the same index of
// `EvaluateResponse.reasons` for it; never treat an unknown reason as no reason.
enum ReasonCode {
  REASON_CODE_UNSPECIFIED = 0;

  // `below_threshold`: the overall similarity is below the threshold that applied.
  REASON_CODE_BELOW_THRESHOLD = 1;

  // `field_below_floor`: one field's similarity is below that field's own floor.
  REASON_CODE_FIELD_BELOW_FLOOR = 2;

  // `anchor_drift`: the overall similarity to the record's anchor is below the drift threshold.
  REASON_CODE_ANCHOR_DRIFT = 3;

  // `quantity_beyond_factor`: one quantity changed by more than its factor limit, or moved between zero and a
  // value above zero.
  REASON_CODE_QUANTITY_BEYOND_FACTOR = 4;

  // `quantity_incomparable`: one quantity is now in a unit that cannot be converted from the one it had, and its
  // schema entry rejects that.
  REASON_CODE_QUANTITY_INCOMPARABLE = 5;

  // `measure_changed`: the measures the record is described by changed (`EvaluateResponse.measure_changed`), and
  // the server's policy rejects that.
  REASON_CODE_MEASURE_CHANGED = 6;
}

// One reason a revision was rejected.
message ReasonDetail {
  ReasonCode code = 1;

  // The field or quantity the reason is about. Set for `FIELD_BELOW_FLOOR` (a `FieldScore.field`, whose
  // `below_floor` is set) and for the two quantity codes (a `QuantityScore.field`, whose `beyond_limit` is set);
  // look there for the units and the change. Absent for the others, which are about the whole record.
  optional string subject = 2;

  // What was measured: the similarity for the three similarity codes, the factor for `QUANTITY_BEYOND_FACTOR`.
  // Absent where no number describes it: a quantity that moved between zero and a value above zero
  // (`QuantityScore.zero_crossing`), `QUANTITY_INCOMPARABLE`, and `MEASURE_CHANGED`. A similarity is the same
  // 32-bit value as the `similarity` it repeats, widened; narrowing it gives that value back exactly.
  optional double value = 3;

  // The configured limit `value` was held to: the threshold, the field's floor, the drift threshold, or the factor
  // limit. Absent for `QUANTITY_INCOMPARABLE` and `MEASURE_CHANGED`, which are yes-or-no rules.
  optional double limit = 4;
}

// How one quantity of the record compares with the baseline.
message QuantityScore {
  string field = 1;

  QuantityChange change = 2;

  // How many times larger or smaller the amount became, after unit conversion; for a range, whichever end moved
  // more. Always at least 1, so "eight times bigger" and "an eighth" are both 8, and exactly 1 when nothing
  // changed. Absent when there is no number to give: for `QUANTITY_CHANGE_ADDED` and `QUANTITY_CHANGE_REMOVED`,
  // and when `incomparable` or `zero_crossing` is set.
  optional double factor = 3;

  // The amount moved between zero and a value above zero, so no factor describes the change.
  bool zero_crossing = 4;

  // The two values are in units that cannot be converted into one another. Always set for
  // `QUANTITY_CHANGE_INCOMPARABLE`, and for a `QUANTITY_CHANGE_RESTORED` quantity whose original value was in such
  // a unit.
  bool incomparable = 5;

  // The unit of the value the record was compared with: the baseline's, or the original's for
  // `QUANTITY_CHANGE_RESTORED`. Absent for `QUANTITY_CHANGE_ADDED`.
  optional string previous_unit = 6;

  // The record's unit. Absent for `QUANTITY_CHANGE_REMOVED`.
  optional string unit = 7;

  // This quantity exceeds a limit the server's schema sets for it (see `QuantityDescription`), which rejects the
  // record regardless of every similarity. Never set when no limit is configured.
  bool beyond_limit = 8;
}

message EvaluateResponse {
  Verdict verdict = 1;

  // Overall similarity to the baseline: the weighted mean of the per-field similarities over the fields that have
  // one (see `FieldScore.similarity`). Absent when there was no baseline.
  optional float similarity = 2;

  // The overall threshold that was applied.
  float threshold = 3;

  // Per-field detail, for every field either side has a value for. Empty when there was no baseline.
  repeated FieldScore fields = 4;

  // Overall similarity to the record's anchor: the first value each field had since the record was first stored
  // (or last force-written). Lets a caller see slow drift across many individually acceptable revisions.
  optional float anchor_similarity = 5;

  // Whether this call changed what is stored.
  bool stored = 6;

  // Human-readable reasons for a `VERDICT_REJECTED`. Empty otherwise. One sentence per entry of `reason_details`,
  // in the same order. The wording is for people and may change; read `reason_details` instead of parsing it.
  repeated string reasons = 7;

  // The record's composite vector, if `return_vector` was set.
  repeated float vector = 8;

  // How many times this record has been written, including this call if `stored`. Zero if it has never been stored.
  uint64 revision = 9;

  // Per-quantity detail, for every quantity either side has a value for. Empty when there was no baseline.
  // Quantities are reported whether or not any limit is configured; they are never part of `similarity`.
  repeated QuantityScore quantities = 10;

  // The record changed which measures it is described by: a quantity became incomparable with its old value, or
  // one quantity was removed as a different one appeared (a weight for a volume). Filling in a quantity that was
  // merely missing does not set this. It rejects the record only if the server's policy says so (see
  // `DescribeResponse.reject_on_measure_change`).
  bool measure_changed = 11;

  // Why a `VERDICT_REJECTED` was rejected, as data: one entry per sentence in `reasons`, in the same order. Empty
  // otherwise. A rejected response with `reasons` but no `reason_details` came from a server older than this field.
  repeated ReasonDetail reason_details = 12;
}

message FindSimilarRequest {
  oneof query {
    // Search around a stored record. `NOT_FOUND` if there is none.
    string id = 1;

    // Search around an arbitrary record, which is embedded but not stored. If it carries an `id`, that id is
    // excluded from the results.
    Record record = 2;
  }

  // How many neighbors to return. Defaults to 10; at most 100.
  uint32 limit = 3;

  // Only return records of this tenant.
  optional string tenant = 4;

  // Only return records at least this similar. Cosine scale, [-1, 1].
  optional float min_similarity = 5;
}

message Neighbor {
  string id = 1;

  optional string tenant = 2;

  float similarity = 3;
}

message FindSimilarResponse {
  repeated Neighbor neighbors = 1;
}

message DeleteRequest {
  string id = 1;

  // The record's tenant. Required if the record is stored under one.
  optional string tenant = 2;
}

message DeleteResponse {
  // Whether there was a record to delete.
  bool deleted = 1;
}

message DescribeRequest {}

// One field of the server's schema.
message FieldDescription {
  string name = 1;

  float weight = 2;

  bool required = 3;

  optional float reject_below = 4;
}

// One quantity of the server's schema.
message QuantityDescription {
  string name = 1;

  // A record that changes this quantity by more than this factor, or moves it between zero and a value above
  // zero, is rejected. Absent if the factor is only reported.
  optional double reject_above_factor = 2;

  // A record that puts this quantity in a unit that cannot be compared with the one it had is rejected.
  bool reject_incomparable = 3;
}

message MatchRequest {
  // The listing, under the field and quantity names the server's schema defines (see `Describe`). Map the
  // listing's own fields onto these names and leave out one with no counterpart. `id` and `tenant` must be
  // absent: a listing's id and its seller belong to another system.
  Record listing = 1;

  // How many candidates to return. Defaults to 5; at most 100.
  uint32 limit = 2;

  // Only consider records of this tenant (the brand, when the caller knows it). Without it every tenant's
  // records are candidates.
  optional string tenant = 3;

  // Holds the best candidate to this in place of the server's match threshold. Cosine scale, [-1, 1].
  optional float threshold = 4;
}

// What was decided about the best candidate.
enum MatchDecision {
  MATCH_DECISION_UNSPECIFIED = 0;

  // No match threshold is configured and the request gave none: the candidates are ranked, and nothing is
  // claimed about the best.
  MATCH_DECISION_NOT_JUDGED = 1;

  // The first candidate's similarity is at or above the threshold.
  MATCH_DECISION_MATCHED = 2;

  // The first candidate's similarity is below the threshold, or there are no candidates.
  MATCH_DECISION_NO_MATCH = 3;
}

message MatchCandidate {
  string id = 1;

  optional string tenant = 2;

  // The weighted mean of the per-field similarities over the fields both the stored record and the listing have:
  // what the decision is made on. `0` if they share no field.
  float similarity = 3;

  // The score the search found this candidate by: what `FindSimilar` would report for it.
  float search_similarity = 4;

  // Read with the stored record as the baseline and the listing as the record: `FIELD_CHANGE_ADDED` is a field
  // only the listing has and `FIELD_CHANGE_REMOVED` one only the stored record has, neither of which is scored.
  // Never `FIELD_CHANGE_RESTORED`, and `below_floor` is never set: a floor is a rule for revisions.
  repeated FieldScore fields = 5;

  // The same reading for quantities. `beyond_limit` is never set.
  repeated QuantityScore quantities = 6;
}

message MatchResponse {
  // Best first. Equal similarities are ordered by id.
  repeated MatchCandidate candidates = 1;

  MatchDecision decision = 2;

  // The threshold the best candidate was held to, if there was one.
  optional float threshold = 3;
}

message DescribeResponse {
  // Identifies the model, tokenizer, vector width, and truncation limit. Vectors are only comparable under the
  // same fingerprint.
  string model_fingerprint = 1;

  // Width of one field's vector.
  uint32 dimension = 2;

  // Width of a record's composite vector: `dimension` times the number of fields.
  uint32 composite_dimension = 3;

  repeated FieldDescription fields = 4;

  // The default overall similarity threshold.
  float threshold = 5;

  // The drift threshold against the anchor, if drift is enforced.
  optional float anchor_threshold = 6;

  // The quantities the schema defines. They are not part of any vector, so they do not appear in
  // `composite_dimension` or in `model_fingerprint`.
  repeated QuantityDescription quantities = 7;

  // Whether a record whose measures changed (`EvaluateResponse.measure_changed`) is rejected.
  bool reject_on_measure_change = 8;

  // The threshold `Match` holds its best candidate to, if one is configured.
  optional float match_threshold = 9;

  // How many candidates `Match` fetches for each one it returns, before scoring them exactly.
  uint32 match_overfetch = 10;
}
