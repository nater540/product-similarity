# The trainer's checkpoint rules: `just mutants-train`. Kept apart from `mutants.toml` because these tests run
# real optimizer steps, and the trainer changes rarely.
examine_globs = ["crates/similarity-train/src/checkpoint.rs"]
# The library tests and the binary's: saving a model, stamping it, and resuming a run are tested end to end from
# `main.rs`, on the tiny model.
additional_cargo_test_args = ["--lib", "--bins"]
cap_lints = true
profile = "mutants"
exclude_re = [
  # Flushing a file or a directory to disk changes what survives a power cut and nothing a test can observe.
  "replace sync_tree -> std::io::Result<\\(\\)> with Ok\\(\\(\\)\\)",
  "replace sync_dir -> std::io::Result<\\(\\)> with Ok\\(\\(\\)\\)",
]
