name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # `RUSTFLAGS` in the environment replaces the flags in `.cargo/config.toml`, it does not add to them, and the
      # macOS link needs the one that is there: ONNX Runtime's library calls into the compiler's runtime library.
      # (`matrix`, not `runner`: the `runner` context does not exist yet where a job's `env` is evaluated.)
      RUSTFLAGS: ${{ matrix.os == 'macos-latest' && '-D warnings -C link-arg=-fapple-link-rtlib' || '-D warnings' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - if: runner.os == 'macOS'
        run: brew install protobuf
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc

  # The real model: parity with PyTorch, then the curated hard cases against the committed verdict snapshot and the
  # README's quoted calibration reports against what `calibrate` prints (D22). The model is cached under the hash
  # of fetch.rs, which pins its revision and checksums; `model fetch` verifies a restored cache and downloads only
  # what is missing. It runs in the dev profile on purpose: the release profile's LTO would add a long second
  # compile for a command that downloads and hashes.
  real-model:
    name: real model (parity and verdict snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/cache@v4
        with:
          path: models/mdbr-leaf-mt
          key: model-${{ hashFiles('crates/similarity-server/src/fetch.rs') }}
      - run: cargo run -p similarity-server -- model fetch
      - run: cargo test -p similarity-core --test real_parity -- --ignored
      - run: cargo test -p similarity-train --test real_parity -- --ignored
      - run: cargo test -p similarity-server --test real_snapshot -- --ignored

  # The storage contract against a real Qdrant. The full stack against Qdrant with the real model
  # (`tests/real_e2e.rs`) stays local, in `just test-real`.
  qdrant:
    name: qdrant contract
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports:
          - 6334:6334
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo test -p similarity-store --test contract -- --ignored
        env:
          QDRANT_URL: http://localhost:6334

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
