# record-similarity configuration. Copy to `config.toml` and adjust.
#
# Every key is validated at start-up; a misspelled key is an error, not a silent default. The Qdrant API key is read
# from the QDRANT_API_KEY environment variable, never from this file.

[server]
# Where the gRPC server listens. Use 0.0.0.0 inside a container.
listen = "127.0.0.1:50051"
# The most records of an `Import` stream that are embedded as one batch. A batch is one job on the one embedding
# thread, and every other request waits while it runs: a larger number loads a catalog faster and makes a
# save by anybody else wait longer while a stream is running. The README has the measurement.
import_batch_records = 8
# How often the server asks its store whether it still answers. Its readiness (the health service's answer for
# `recordsimilarity.v1.RecordSimilarity`) is that old at most. Liveness, the empty service name, does not depend
# on the store.
store_check_every_ms = 2000
# On SIGTERM the server reports "not ready" at once and goes on serving for this long, so that whatever sends it
# requests can notice and stop before the listener closes. Ctrl-C skips it. What it should be depends on how
# fast your load balancer acts on a failed readiness check.
drain_notice_ms = 5000
# After that, requests already in flight get this long to finish before the server stops anyway. Keep the sum of
# the two under the time your orchestrator allows a process to stop (30 seconds by default on Kubernetes).
drain_deadline_ms = 20000

[model]
# A sentence-transformers model directory, as written by `record-similarity model fetch`, with the `onnx/model.onnx`
# that `just export-onnx` adds to it. ONNX Runtime runs the model from that file, on the CPU, and every command
# checks the file against the directory's weights before using it. There is no setting for either.
dir = "models/mdbr-leaf-mt"
# Texts are truncated to this many tokens. Cost grows with the square of it.
max_tokens = 256
# Keep the first N components of each field vector. The default model is trained to allow this; REMOVE THIS LINE
# for any model that is not (all-MiniLM-L6-v2, gte-small, bge-small-en-v1.5, ...), or part of its embedding is
# thrown away. Changing it, the model, or max_tokens changes the model fingerprint, which means re-indexing into a
# new collection.
output_dim = 256
# The most texts in one forward pass.
batch_size = 32
# Requests that may wait for the encoder before new ones get RESOURCE_EXHAUSTED.
queue_depth = 256
# The model the thresholds below were measured with. Not set here. Set it in a production config, to the
# fingerprint on the `model` line of `calibrate` (or the one `model promote` prints): `serve` and `import` then
# refuse to run with any other model, because thresholds do not transfer between models.
# expected_fingerprint = "..."

[qdrant]
url = "http://localhost:6334"
collection = "records"
timeout_ms = 5000

[policy]
# Reject a revision whose weighted similarity to the stored record is below this. Only text fields enter this
# score; quantities (below) are compared separately and never move it.
#
# Cosine similarities from a sentence encoder are not percentages: with the default model two unrelated products
# still score around 0.5. On data/calibration.sample.jsonl ordinary edits score 0.94 to 1.00 and recycled products
# 0.50 to 0.85, so 0.90 sits in the gap. Those pairs are synthetic; re-run `record-similarity calibrate` on labeled
# edits from production before trusting this number.
threshold = 0.90
# Reject a revision that has drifted this far from the record as first stored, however small each step was.
# Omit to report drift (`anchor_similarity` in the response) without enforcing it.
#
# 0.85 is not a measurement. It is a place to start, below the overall threshold so that a record's first edit is
# never held to something stricter than that. Where it belongs is read from whole edit histories:
# `record-similarity calibrate-drift` on real ones (README, "The drift threshold").
anchor_threshold = 0.85
# Reject a revision that changes which measures a record is described by: a quantity whose unit can no longer be
# compared with its old one (THC in % becoming THC in mg), or one quantity removed as another appears (a weight
# for a volume). Reported in every response as `measure_changed`; uncomment to enforce it, once `calibrate` on
# labeled production edits shows that legitimate edits never do this.
# reject_on_measure_change = true

# The record schema. Field names here are the keys callers send. Weights are relative. Adding or removing a field
# changes the vector layout, which means re-indexing into a new collection; changing a weight does not.

[fields.name]
weight = 4.0
required = true
# The name alone may not change beyond this, whatever the overall score says. In the calibration set a legitimately
# edited name never scores below 0.87 and a recycled one never above 0.73.
reject_below = 0.80

[fields.category]
weight = 3.0

[fields.brand]
weight = 1.0

[fields.description]
weight = 2.0

# The record's quantities: numeric fields with a unit, compared as numbers after unit conversion and never
# embedded. Naming one here is what defines it; callers send it in `quantities`, not in `fields`. Adding or removing
# a quantity changes no vector, so it never means re-indexing.
#
# NO LIMITS ARE SET HERE, ON PURPOSE. Every quantity below is compared and reported in each response (how many
# times larger or smaller it became, whether its unit is still comparable) and rejects nothing. Where a limit
# belongs is a measurement, exactly like a threshold: run `record-similarity calibrate` on labeled production
# edits, read the "quantity (factor)" section of the report, and only then set, per quantity:
#
#   reject_above_factor = 4.0   # reject a change by more than this factor, in either direction (always >= 1)
#   reject_incomparable = true  # reject a unit that cannot be compared with the old one
#
# The synthetic pairs in data/calibration.sample.jsonl are far too few to choose either from.

[quantities.weight_per_item]

[quantities.volume_per_item]

[quantities.thc_per_item]

[quantities.cbd_per_item]

# Matching a menu item (an entry on a retailer's menu) to the stored record it describes: the `Match` call.
[matching]
# The similarity the best candidate has to reach to be called a match. NOT SET HERE, ON PURPOSE: it is a
# measurement, like `policy.threshold`, read from `record-similarity calibrate-match` on held-out catalog groups.
# Without it, `Match` ranks its candidates and decides nothing.
# threshold = ...
#
# How many records are fetched and scored exactly for each candidate returned. A cost, not a threshold: the
# search that finds candidates under-scores records with more fields filled in than the menu item has, so the
# right one may not be among the first few. `calibrate-match` reports what a given value loses.
overfetch = 5

# A candidate policy, judged in the shadow of the one above. Optional, and off unless the table is there.
#
# With it, the server judges every revision a second time under the candidate (the same vectors, against the same
# stored record) and writes a line on stdout for each one the candidate would have decided the other way. The
# candidate decides nothing: no verdict, response, or stored record depends on it.
#
# NO NUMBERS ARE GIVEN HERE, ON PURPOSE. A candidate's threshold is a measurement like any other: take it from
# `record-similarity calibrate` or `calibrate-sweep` run with the candidate's weights and floors.
#
#   [shadow]
#   name = "..."                  # written on every line
#   events = "disagreements"      # or "all": a line for every judged revision
#   summary_every_s = 60          # how often the running counts are written
#
#   [shadow.policy]               # a whole policy: nothing is inherited from [policy]
#   threshold = ...
#   anchor_threshold = ...        # omit, and the candidate does not enforce drift
#
#   [shadow.fields.name]          # overrides of [fields] and [quantities]; what is not named stays as it is
#   weight = ...
#   reject_below = ...            # or "off" for no floor
#
#   [shadow.quantities.weight_per_item]
#   reject_above_factor = ...     # or "off" for no limit
