# cargo-deny configuration: `just deny`. https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
]

[advisories]
db-path = "~/.cargo/deny-advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
  # `paste` is an archived, feature-complete proc-macro crate pulled in by Burn. It runs at compile time only, has no
  # known vulnerability, and has no drop-in upgrade; revisit when Burn moves off it.
  { id = "RUSTSEC-2024-0436", reason = "compile-time macro crate required by burn 0.22; unmaintained, not vulnerable" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  # Mozilla's root certificate list, as data, in `webpki-roots` (used by `model fetch`).
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { crate = "openssl-sys", reason = "rustls only; no OpenSSL in this workspace" },
  { crate = "openssl", reason = "rustls only; no OpenSSL in this workspace" },
  { crate = "native-tls", reason = "rustls only" },
]
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
