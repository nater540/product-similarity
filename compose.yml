# Local development stack.
#
#   docker compose up -d qdrant                  # just the vector store, for `cargo run` and the ignored tests
#   docker compose --profile server up --build   # the server too, built from this checkout
#   docker compose --profile observability up -d # Prometheus and an OpenTelemetry Collector, to watch a server
#
# Qdrant's dashboard is at http://localhost:6333/dashboard, and Prometheus is at http://localhost:9090.

services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "127.0.0.1:6333:6333" # REST and dashboard
      - "127.0.0.1:6334:6334" # gRPC, which the server uses
    volumes:
      - ./qdrant_storage:/qdrant/storage

  server:
    build: .
    profiles: ["server"]
    depends_on:
      - qdrant
    ports:
      - "127.0.0.1:50051:50051"
    environment:
      RUST_LOG: info

  # What a server's metrics are sent to and read by (README, "Metrics"; `just observe-up`). The server itself
  # runs on this machine, with `metrics.listen` and `metrics.otlp_endpoint` set.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.0
    profiles: ["observability"]
    command: ["--config=/etc/otel-collector.yml"]
    volumes:
      - ./deploy/observability/otel-collector.yml:/etc/otel-collector.yml:ro
    ports:
      - "127.0.0.1:4317:4317" # OTLP over gRPC, which the server pushes to

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    depends_on:
      - otel-collector
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090" # queries and the web page
    extra_hosts:
      - "host.docker.internal:host-gateway" # the machine the server runs on, also on Linux
