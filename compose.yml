# Local development stack.
#
#   docker compose up -d qdrant                  # just the vector store, for `cargo run` and the ignored tests
#   docker compose --profile server up --build   # the server too, built from this checkout
#   docker compose --profile observability up -d # a Collector, Jaeger, Prometheus, and Grafana, to watch a server
#
# Qdrant's dashboard is at http://localhost:6333/dashboard, Jaeger (traces) is at http://localhost:16686,
# Prometheus (metrics) is at http://localhost:9090, and Grafana (a dashboard of both) is at http://localhost:3000.

services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "127.0.0.1:6333:6333" # REST and dashboard
      - "127.0.0.1:6334:6334" # gRPC, which the server uses
    volumes:
      - ./qdrant_storage:/qdrant/storage

  server:
    build: .
    profiles: ["server"]
    depends_on:
      - qdrant
    ports:
      - "127.0.0.1:50051:50051"
    environment:
      RUST_LOG: info

  # What a server's traces and metrics are sent to and read by (README, "Telemetry"; `just observe-up`). The
  # server itself runs on this machine, with `telemetry.otlp_endpoint` and `telemetry.metrics_listen` set.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.0
    profiles: ["observability"]
    command: ["--config=/etc/otel-collector.yml"]
    volumes:
      - ./deploy/observability/otel-collector.yml:/etc/otel-collector.yml:ro
    ports:
      - "127.0.0.1:4317:4317" # OTLP over gRPC, which the server sends to

  # Keeps the traces the collector passes on, in memory, and shows them.
  jaeger:
    image: jaegertracing/jaeger:2.8.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:16686:16686" # the web page and the query API

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    depends_on:
      - otel-collector
      - jaeger
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090" # queries and the web page
    extra_hosts:
      - "host.docker.internal:host-gateway" # the machine the server runs on, also on Linux

  # A dashboard of the server's metrics, with its latest traces beside them. Everything it shows is in files
  # (`deploy/observability/grafana/`): the two things it reads from and the one dashboard, which is also the
  # page it opens on. It keeps nothing, like the rest of the profile, and asks nothing of the internet. Nobody
  # has to sign in to look: whoever can reach the port is a viewer, and the port is this machine's alone. To
  # change a panel or try a query in Explore, sign in as `admin` with the password `admin`, which is Grafana's
  # own default. (An anonymous editor would save that step, and Grafana 13 says the setting is going away.)
  grafana:
    image: grafana/grafana:13.3.2
    profiles: ["observability"]
    depends_on:
      - prometheus
      - jaeger
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/record-similarity.json
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000" # the web page
